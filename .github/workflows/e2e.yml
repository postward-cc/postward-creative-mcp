name: E2E (every tool in Docker)

# Executes the shipped artifact: the e2e harness runs as a build stage of
# Dockerfile.e2e, spawning the bundled MCP server and calling all 23 tools
# plus a multi-tool pipeline inside the same image users pull from ghcr.

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "Dockerfile*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# One run per branch: a new PR push cancels the previous run of that PR.
# Main and tag runs are never cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Every tool, in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Run e2e suite inside the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.e2e
          target: e2e-test
          push: false
          # GHA cache (free for public repos). PRs read main's cache;
          # only main writes, so PR runs never thrash it.
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=min' || '' }}
