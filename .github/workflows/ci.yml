name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a new PR push cancels the previous run of that PR.
# Main runs are never cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck + unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Hermetic suite: pure ffmpeg argument builders, error contracts and
      # the MCP server surface. Real-media execution lives in the E2E
      # workflow, which runs every tool inside the shipped Docker image;
      # the in-tree integration tests self-skip when the runner has no
      # ffmpeg/ImageMagick.
      - run: npm test

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: false
          # GHA cache (10 GB, free for public repos). PRs read main's cache;
          # only main writes, so PR runs never thrash it.
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=min' || '' }}
