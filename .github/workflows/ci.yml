name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck + unit suite
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Hermetic suite: pure ffmpeg argument builders, error contracts and
      # the MCP server surface. Real-media execution lives in the E2E
      # workflow, which runs every tool inside the shipped Docker image;
      # the in-tree integration tests self-skip when the runner has no
      # ffmpeg/ImageMagick.
      - run: npm test

  docker-build:
    name: Docker build
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx (remote)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit:1234

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: false
          cache-from: type=registry,ref=harbor.local/postward/postward-creative-mcp:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=registry,ref=harbor.local/postward/postward-creative-mcp:buildcache,mode=min,ignore-error=true' || '' }}
