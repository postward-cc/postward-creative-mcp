version: 2

# This repository had no update automation, which is why the base image drifted
# twice without anyone being told: the Dockerfile went on building from a Node
# release the rest of the project had moved past, and nothing raised it. The
# cloud tracks the image this repo *publishes*; nothing tracked what this repo
# *builds from*.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # The coverage provider is a plugin of the test runner, not a dependency
      # beside it: @vitest/coverage-v8 5 refuses to load under vitest 3, and
      # Dependabot proposes them as two unrelated pull requests. The first one
      # cannot go green on its own — it fails the typecheck, the E2E and the
      # Docker build, all three — and a dependency update that can never pass is
      # noise that trains you to ignore the ones that can. No update-types here
      # on purpose: the major is exactly the case that has to arrive together.
      vitest:
        patterns: ["vitest", "@vitest/*"]

      # Everything else: patch and minor arrive as one pull request, majors come
      # on their own, because those are the ones that need reading before
      # merging.
      deps:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Held back deliberately. `engines.node`, the CI node-version, the
      # Dockerfile base and this dependency have to move together, and four
      # separate Dependabot pull requests would break the agreement between
      # them. Moving Node is a reviewed change across both repositories, not a
      # version bump; see the note in the docker entry below.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 is the native-compiler major and the version bump is never
      # the whole change. The build script passes compiler flags on the command
      # line alongside a file, which tsc 5 tolerated silently and tsc 7 rejects
      # with TS5112. Landing it means a dedicated tsconfig for the declaration
      # emit plus that script change — a build-pipeline change, carried by its
      # own pull request. Ignored here so it stops arriving as a bump that can
      # only fail; when that pull request happens, this entry and the version
      # move together.
      #
      # The migration is already measured: on 7.0.2 with that fix, the build
      # passes and the emitted .d.ts is byte-for-byte identical to 5.9.3's.
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]

  # Two things depend on the Node release line: the published media base image
  # and the binary a user runs. This ecosystem is what turns "Node 24 is still
  # supported" into a pull request instead of something nobody notices, and it
  # is also what will announce Node 26 LTS — including for the media base, which
  # the cloud then consumes through its own media-toolchain group.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
